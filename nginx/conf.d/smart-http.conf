# ─────────────────────────────────────────────────────────────────────
#  ÉTAPE 1 — configuration TEMPORAIRE, HTTP uniquement.
#  Sert uniquement à obtenir le premier certificat Let's Encrypt.
#  Une fois le certificat émis, remplacer ce fichier par smart.conf
#  (voir INSTALLATION.md).
#
#  Remplacer DOMAINE par le nom de domaine réel avant utilisation.
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    # Répertoire utilisé par certbot pour le challenge ACME
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Pendant l'étape 1, l'application reste servie en HTTP
    location /api/ {
        proxy_pass http://sta_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://sta_frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
