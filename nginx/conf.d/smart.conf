# ─────────────────────────────────────────────────────────────────────
#  Smart Transport AI — reverse proxy HTTPS
#
#  Remplacer DOMAINE par le nom de domaine réel (3 occurrences)
#  avant utilisation :
#      sed -i 's/DOMAINE/app.mon-domaine.fr/g' smart.conf
#
#  À installer UNIQUEMENT après émission du certificat (voir
#  INSTALLATION.md) : nginx refuse de démarrer si les fichiers
#  de certificat n'existent pas.
# ─────────────────────────────────────────────────────────────────────

# ── HTTP : renouvellement ACME + redirection permanente vers HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAINE;

    ssl_certificate     /etc/letsencrypt/live/DOMAINE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAINE/privkey.pem;

    # Paramètres TLS définis en clair (pas de dépendance à un fichier
    # externe généré par certbot, dont l'absence ferait échouer nginx)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── En-têtes de sécurité ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Masque la version de nginx dans les réponses
    server_tokens off;

    # Dépôt de rapports VGP (PDF) — plusieurs fichiers simultanés
    client_max_body_size 25m;

    # ── API ──
    location /api/ {
        proxy_pass http://sta_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une optimisation peut durer plusieurs dizaines de secondes.
        # 180 s couvre largement les volumes actuels.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ── Documentation interactive de l'API : non exposée publiquement ──
    location ~ ^/(docs|redoc|openapi.json) {
        return 404;
    }

    # ── Interface ──
    location / {
        proxy_pass http://sta_frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
